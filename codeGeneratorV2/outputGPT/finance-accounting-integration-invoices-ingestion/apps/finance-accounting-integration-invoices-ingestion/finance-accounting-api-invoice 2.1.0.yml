openapi: 3.0.1
info:
  title: Ambulance Invoices Integration Trigger
  x-ibm-name: finance-accounting-api-invoices-ingestion
  version: 2.2.0
  description: |
    **Finance & Accounting API: Invoice Integration Trigger**

    This API facilitates file-based integration workflows between external systems and SAP for finance and accounting purposes.
 
     ### Documentation
    - [Invoice and Payments Financial Data Flows](https://tcsgroup.atlassian.net/wiki/x/HgvwAg)
    - [API Documentation](https://tcsgroup.atlassian.net/wiki/x/MIAmJ)
    - [Initial API Story](https://tcsgroup.atlassian.net/browse/NIPO-6628)

  contact:
    name: 05_IT_Applications_Solutions
    email: 05_IT_Applications_Solutions@tcs.ch

x-change-log:
  - date: 2025-09-03
    author: HUENI Victor
    from: 1.0.0
    to: 2.0.0
    description: |
      Breaking changes : All the response body changes
      Change the flow from async to sync with a multi items response
      Add example in the response of the ingestion
      Add GET /health operation
    ticket: https://tcsgroup.atlassian.net/browse/NIPO-7290
  - date: 2025-09-22
    author: HUENI Victor
    from: 2.0.0
    to: 2.1.0
    description: |
      Added two new operations:
      - POST /sarge-files-injection-trigger (copy of /asv-files-injection-trigger)
      - POST /sarge-files-purge-trigger (copy of /asv-files-purge-trigger)
    ticket: https://tcsgroup.atlassian.net/browse/NIPO-7289
  - date: 2025-09-25
    author: HUENI Victor
    from: 2.1.0
    to: 2.2.0
    description: |
      Added two new operations:
      - POST /sarvd-files-injection-trigger (copy of /asv-files-injection-trigger)
      - POST /sarvd-files-purge-trigger (copy of /asv-files-purge-trigger)
    ticket: https://tcsgroup.atlassian.net/browse/NIPO-7376

