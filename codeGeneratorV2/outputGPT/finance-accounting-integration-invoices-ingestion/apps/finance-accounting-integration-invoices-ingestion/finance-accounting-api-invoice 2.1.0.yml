components:
  schemas:
    ServiceError:
      title: ServiceError
      type: object
      description: Object returned when errors occurred
      properties:
        httpCode:
          type: string
        httpMessage:
          type: string
        moreInformation:
          type: string
      required:
        - httpCode
        - httpMessage
        - moreInformation

    IngestionResponse:
      title: IngestionResponse
      type: object
      description: Response returned when the ingestion trigger has been evaluated.
      properties:
        meta:
          type: object
          properties:
            submissionId:
              type: string
              example: "4a9a3b64-8a14-4a31-9b47-6f38f4c57a7c"
            timestamp:
              type: string
              format: date-time
              example: "2025-09-25T14:48:00"
          required:
            - submissionId
            - timestamp
        data:
          type: object
          properties:
            status:
              type: string
              example: COMPLETED
            receivedCount:
              type: integer
              example: 3
            message:
              type: string
              example: Batch file ingestion completed.
          required:
            - status
            - receivedCount
            - message
      required:
        - meta
        - data

    PurgeResponse:
      title: PurgeResponse
      type: object
      description: Response returned when the Purge is successfully triggered.
      properties:
        httpCode:
          type: integer
          example: 202
        httpMessage:
          type: string
          example: "Accepted"
        moreInformation:
          type: string
          example: "ASV File Purge triggered properly"
      required:
        - httpCode
        - httpMessage
        - moreInformation
        
    HealthType:
      type: object
      properties:
        status:
          type: string
          description: status of the health check
          enum: [pass, error]
        api:
          type: string
          description: api/app name of the component
        timestamp:
          type: string
          format: date-time
        checks:
          type: array
          items:
            $ref: '#/components/schemas/Check'
    Check:
      type: object
      description: 'describe a component check (MQ, DataBase, BackEnd etc..)'
      properties:
        component:
          type: string
          description: 'name of the tested component (MQ, Baloise, Toni, etc..)'
        status:
          type: string
          description: status of the tested component
          enum: [pass, error, warn]
        details:
          type: string
          description: details

  examples:
    EmptyProcessing:
      summary: No invoices processed
      value:
        httpCode: '500'
        httpMessage: 'Internal server error'
        moreInformation: 'Error reading file. File is missing, file is empty or file is bad formated(JSON)'
    TechnicalIssueOnTheFlow:
      summary: Either ACE app / SAP is having tehcnical issue
      value:
        httpCode: '500'
        httpMessage: 'Internal server error'
        moreInformation: 'Error calling SAP. Invoices moved to error file'
    FailedProcessing:
      summary: Ingestion completed with technical failures
      value:
        meta:
          submissionId: '4a9a3b64-8a14-4a31-9b47-6f38f4c57a7c'
          timestamp: '2025-09-25T14:48:00'
        data:
          status: FAILED
          receivedCount: 2
          message: Invoices moved to error file.
    SuccessfulProcessing:
      summary: Ingestion completed
      value:
        meta:
          submissionId: '4a9a3b64-8a14-4a31-9b47-6f38f4c57a7c'
          timestamp: '2025-09-25T14:48:00'
        data:
          status: COMPLETED
          receivedCount: 2
          message: Batch file ingestion completed.
    PartialFailureProcessing:
      summary: Ingestion completed with warnings
      value:
        meta:
          submissionId: '4a9a3b64-8a14-4a31-9b47-6f38f4c57a7c'
          timestamp: '2025-09-25T14:48:00'
        data:
          status: PARTIAL_SUCCESS
          receivedCount: 5
          message: Batch file ingestion completed with some invoices written to the error folder.