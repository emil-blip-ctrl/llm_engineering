---
id: requirements-specification
alias: BRD/FRS
format: markdown
template: templates/artefacts/requirements-specification.md
storage-pattern: "docs/requirements/{slug}.md"
standards:
  - IEEE 830 SRS
  - BABOK v3
  - Agile User Story (Connextra format)

ownership:
  responsible: business-analyst
  accountable: product-owner-assistant
  consulted: [architect]
  informed:  [developer, tester]

quality-gate:
  reviewer: product-owner-assistant
  checklist:
    - each requirement uniquely identified
    - acceptance criteria present (Given/When/Then)
    - priority assigned (MoSCoW)
    - traceability to business objective
    - no solution bias (what not how)

lifecycle:
  initial-state: draft
  transitions:
    draft      → proposed   : business-analyst
    proposed   → accepted   : product-owner-assistant
    accepted   → deprecated : product-owner-assistant
    accepted   → superseded : business-analyst
---
