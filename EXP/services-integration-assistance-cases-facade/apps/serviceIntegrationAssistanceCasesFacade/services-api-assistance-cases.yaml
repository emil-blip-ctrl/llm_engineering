---
swagger: "2.0"
info:
  description: "services-api-assistance-cases"
  version: "1.0.0"
  title: "services-api-assistance-cases"
  contact:
    email: "05_IT_Applications_Solutions@tcs.ch"
externalDocs:
  description: "Public API for Assistance Cases"
  url: "https://confluence.tcsgroup.ch/x/hBC-Ig"
basePath: "/services/v1/integration/assistance/facade/cases"
schemes:
- "https"
paths:
  /:
    post:
      summary: "create an assistance case"
      description: "create an assistance case"
      operationId: "create_case"
      parameters:
      - name: "fullCase"
        in: "body"
        required: true
        description: "full case description"
        schema:
          $ref: "#/definitions/case"
      responses:
        "200":
          description: "ok"
          schema:
            $ref: "#/definitions/case"
        "400":
          description: "One or all of the mandatory parameters are incorrectly formatted\
            \ or missing"
          schema:
            type: "array"
            items:
              $ref: "#/definitions/Error"
        "401":
          description: "Unauthorized"
          schema:
            type: "string"
        "404":
          description: "the client was able to communicate with a given server, but\
            \ the server could not find what was requested"
          schema:
            type: "string"
        "408":
          description: "Attempts to access the service fail repeatedly"
          schema:
            type: "string"
        "429":
          description: "The rate limit has been exceeded"
          schema:
            type: "string"
        "500":
          description: "The service is either unreachable or the service encountered\
            \ a fatal error"
          schema:
            type: "array"
            items:
              $ref: "#/definitions/Error"
  /{case-id}:
    put:
      summary: "update an assistance case"
      description: "update an assistance case"
      operationId: "update_case"
      parameters:
      - name: "case-id"
        in: "path"
        required: true
        description: "case reference number"
        type: "string"
      - name: "fullCase"
        in: "body"
        required: true
        description: "full case description"
        schema:
          $ref: "#/definitions/case"
      responses:
        "200":
          description: "ok"
          schema:
            $ref: "#/definitions/case"
        "400":
          description: "One or all of the mandatory parameters are incorrectly formatted\
            \ or missing"
          schema:
            type: "array"
            items:
              $ref: "#/definitions/Error"
        "401":
          description: "Unauthorized"
          schema:
            type: "string"
        "404":
          description: "the client was able to communicate with a given server, but\
            \ the server could not find what was requested"
          schema:
            type: "string"
        "408":
          description: "Attempts to access the service fail repeatedly"
          schema:
            type: "string"
        "429":
          description: "The rate limit has been exceeded"
          schema:
            type: "string"
        "500":
          description: "The service is either unreachable or the service encountered\
            \ a fatal error"
          schema:
            type: "array"
            items:
              $ref: "#/definitions/Error"
  /{case-id}/services-deliveries:
    post:
      summary: "create a new assistance service"
      description: "create a new assistance service for the given case identifier"
      operationId: "create_service"
      parameters:
      - name: "case-id"
        in: "path"
        required: true
        description: "case reference number"
        type: "string"
      - name: "serviceAssistance"
        in: "body"
        required: true
        description: "full assistance service"
        schema:
          $ref: "#/definitions/servicedelivery"
      responses:
        "200":
          description: "ok"
          schema:
            $ref: "#/definitions/servicedelivery"
        "400":
          description: "One or all of the mandatory parameters are incorrectly formatted\
            \ or missing"
          schema:
            type: "array"
            items:
              $ref: "#/definitions/Error"
        "401":
          description: "Unauthorized"
          schema:
            type: "string"
        "404":
          description: "the client was able to communicate with a given server, but\
            \ the server could not find what was requested"
          schema:
            type: "string"
        "408":
          description: "Attempts to access the service fail repeatedly"
          schema:
            type: "string"
        "429":
          description: "The rate limit has been exceeded"
          schema:
            type: "string"
        "500":
          description: "The service is either unreachable or the service encountered\
            \ a fatal error"
          schema:
            type: "array"
            items:
              $ref: "#/definitions/Error"
  /{case-id}/services-deliveries/{service-delivery-id}:
    put:
      summary: "update an assistance service"
      description: "update an assistance service"
      operationId: "update_service"
      parameters:
      - name: "case-id"
        in: "path"
        required: true
        description: "case reference number"
        type: "string"
      - name: "service-delivery-id"
        in: "path"
        required: true
        description: "service identifier"
        type: "string"
      - name: "serviceAssistance"
        in: "body"
        required: true
        description: "full assistance service"
        schema:
          $ref: "#/definitions/servicedelivery"
      responses:
        "200":
          description: "ok"
          schema:
            $ref: "#/definitions/servicedelivery"
        "400":
          description: "One or all of the mandatory parameters are incorrectly formatted\
            \ or missing"
          schema:
            type: "array"
            items:
              $ref: "#/definitions/Error"
        "401":
          description: "Unauthorized"
          schema:
            type: "string"
        "404":
          description: "the client was able to communicate with a given server, but\
            \ the server could not find what was requested"
          schema:
            type: "string"
        "408":
          description: "Attempts to access the service fail repeatedly"
          schema:
            type: "string"
        "429":
          description: "The rate limit has been exceeded"
          schema:
            type: "string"
        "500":
          description: "The service is either unreachable or the service encountered\
            \ a fatal error"
          schema:
            type: "array"
            items:
              $ref: "#/definitions/Error"
  /{case-id}/services-deliveries/{service-delivery-id}/field-agents/{field-agent-id}/events:
    post:
      operationId: "field_agent_event"
      responses:
        "200":
          description: "The operation was successful."
        "400":
          description: "One or all of the mandatory parameters are incorrectly formatted\
            \ or missing"
          schema:
            type: "array"
            items:
              $ref: "#/definitions/Error"
        "401":
          description: "Unauthorized"
        "404":
          description: "the client was able to communicate with a given server, but\
            \ the server could not find what was requested"
        "408":
          description: "Attempts to access the service fail repeatedly"
        "429":
          description: "The rate limit has been exceeded"
        "500":
          description: "The service is either unreachable or the service encountered\
            \ a fatal error"
          schema:
            type: "array"
            items:
              $ref: "#/definitions/Error"
      consumes:
      - "application/json"
      produces:
      - "application/json"
      description: "notify a change on the field agent dispatched on an assistance\
        \ service"
      parameters:
      - required: true
        name: "case-id"
        in: "path"
        type: "string"
        description: "case reference number"
      - required: true
        name: "service-delivery-id"
        in: "path"
        type: "string"
        description: "service identifier"
      - required: true
        name: "field-agent-id"
        in: "path"
        type: "string"
        description: "field agent identifier"
      - name: "body"
        in: "body"
        schema:
          $ref: "#/definitions/event"
        description: "The request body for the operation"
        required: true
  /history:
    get:
      summary: "Retrieve the cases history for a given client personal reference"
      description: "Retrieve the cases history for a given client personal reference"
      operationId: "history_case"
      parameters:
      - name: "personalreference"
        in: "query"
        required: true
        type: "integer"
        maximum: 999999999
        description: "personal reference"
      responses:
        "200":
          description: "Simplified case with only some attributes (but in the common\
            \ structure)"
          schema:
            $ref: "#/definitions/case"
        "400":
          description: "One or all of the mandatory parameters are incorrectly formatted\
            \ or missing"
          schema:
            type: "string"
        "401":
          description: "Unauthorized"
          schema:
            type: "string"
        "500":
          description: "The service is either unreachable or the service encountered\
            \ a fatal error"
          schema:
            type: "string"
definitions:
  activity:
    type: "object"
    description: "Activity provided by a Field Agent in a Case context for Assistance\
      \ delivery."
    properties:
      ServiceDeliveryId:
        type: "number"
      Name:
        type: "string"
        description: "Repair/Towing/etc.. "
      ExecutionDateTime:
        type: "string"
        format: "datetime"
        description: "When happend "
      Reference:
        type: "number"
        description: "Reference number "
      Reason:
        type: "string"
        description: "Reason of activity "
      Comment:
        $ref: "#/definitions/note"
        description: "Note/Remarks "
      Status:
        type: "string"
        description: "Activity Status "
      SparePartList:
        type: "array"
        items:
          $ref: "#/definitions/sparepart"
        description: "SpareParts used  "
      Active:
        type: "boolean"
  address:
    type: "object"
    description: "Adress information for a building or street or highway "
    properties:
      Id:
        type: "string"
      EGID:
        type: "string"
        description: "GWR Address Id "
      EDID:
        type: "string"
        description: "GWR House Entrance Id "
        example: "0"
      Type:
        type: "string"
        description: "ASSYS-5108 - lov name: addresstype "
        example: "Address, Highway, Street"
      Country:
        type: "string"
        description: "lov name: countryiso "
        example: "CH"
      Canton:
        type: "string"
        description: "lov name: swissstate "
        example: "BE"
      City:
        type: "string"
        description: "Locality name  "
        example: "Urtenen-Schönbühl"
      ZipCode:
        type: "string"
        example: "3322"
      Street:
        type: "string"
        description: "Streetname "
        example: "Bahnhofstrasse"
      HouseNb:
        type: "string"
        description: "House number  "
        example: "5"
      AdditionalInformation:
        type: "string"
        description: "Also used to name foreign highways "
      POBox:
        type: "boolean"
        description: "PO Box with number to use in the future for billing purpose,\
          \ otherwise POBox without number. "
      POBoxNumber:
        type: "string"
      Coordinate:
        $ref: "#/definitions/coordinate"
        description: "Also used for Highway Nodes "
      HWName:
        type: "string"
        description: "In a POI, Name of a swiss highway "
        example: "A1 Bern - Zürich"
      HWSegment:
        type: "string"
        description: "In a POI, Segment of a swiss highway "
        example: "Schönbühl - Luterbach"
      HWDirection:
        type: "string"
        description: "In a POI, Driving direction on the swiss highway "
        example: "Rudolf/Zürich [Luterbach]"
      HWNodeMilestone:
        type: "number"
        description: "In a POI, Mileage in unit KM for swiss highway "
        example: "15.5"
      HWNodeDescription:
        type: "string"
        description: "In a POI, Description of a highway mileage node for swiss highway "
        example: "Kirchberg - Einfahrt"
  amount:
    type: "object"
    description: "Amount information for the authorized amount of a service delivery."
    properties:
      AmountCH:
        type: "number"
        description: "TTC "
        example: "134.1"
      AmountForeignCurrency:
        type: "number"
        description: "TTC "
        example: "123.55"
      ForeignCurrency:
        type: "string"
        description: "lov name: currency "
        example: "EUR"
      Date:
        type: "string"
        format: "datetime"
      ExchangeRate:
        type: "number"
  b2bpartnership:
    type: "object"
    description: "B2B Partnership used in POI"
    properties:
      Partnership:
        type: "string"
        description: "uniquement *(POI B2B) dans la liste carmanufacturer! - lov name:\
          \ carmanufacturer "
      Dealercode:
        type: "string"
        example: "51600"
  backofficeinformation:
    type: "object"
    description: "Backoffice information"
    properties:
      SupplierReference:
        type: "string"
        example: "910066"
      PartnerReference:
        type: "string"
      SalesforceReference:
        type: "string"
      PaymentType:
        type: "string"
        description: "lov name: paymenttype "
      SubjectToVAT:
        type: "boolean"
      VATNumber:
        type: "string"
        example: "CHE-105.974.329"
      AutomaticBookingAllowed:
        type: "boolean"
      HeadOffice:
        $ref: "#/definitions/legalperson"
      BillingAddress:
        $ref: "#/definitions/address"
  batterydiagnostic:
    type: "object"
    description: "Check the battery state by performing a diagnostic check."
    properties:
      DiagnosticDate:
        type: "string"
        format: "datetime"
        description: "Date of diagnostic extractionZeit=16:22:58 Datum=01.01.1970\
          \ - CDM TCS V1.1: n/a - Interface-Assys Spec.: diagnosticDate "
      SettingType:
        type: "string"
        description: "Batterietyp=Blei - CDM TCS V1.1: n/a - Interface-Assys Spec.:\
          \ settingType "
      SettingStandard:
        type: "string"
        description: "Batterienorm=EN - CDM TCS V1.1: n/a - Interface-Assys Spec.:\
          \ settingStandard "
      SettingCCARating:
        type: "string"
        description: "Kaltstartstrom=600 A - CDM TCS V1.1: n/a - Interface-Assys Spec.:\
          \ settingCCARating "
      SettingCapacity:
        type: "string"
        description: "Kapazitaet=60 Ah - CDM TCS V1.1: n/a - Interface-Assys Spec.:\
          \ settingCapacity "
      SettingAge:
        type: "string"
        description: "Alter=2 Jahre - CDM TCS V1.1: n/a - Interface-Assys Spec.: settingAge "
      BatteryVoltage:
        type: "string"
        description: "Spannung=12,64 V - CDM TCS V1.1: n/a - Interface-Assys Spec.:\
          \ batteryTestVoltage "
      BatteryCCARating:
        type: "string"
        description: "Kaltstartstrom=532 A - CDM TCS V1.1: n/a - Interface-Assys Spec.:\
          \ batteryTestCCARating "
      BatteryTemperature:
        type: "string"
        description: "Temperatur=22,36 °C - CDM TCS V1.1: n/a - Interface-Assys Spec.:\
          \ batteryTestTemperature "
      BatterySOC:
        type: "string"
        description: "SOC=93,9% - CDM TCS V1.1: n/a - Interface-Assys Spec.: batteryTestSOC "
      BatterySOH:
        type: "string"
        description: "SOH=66,6% - CDM TCS V1.1: n/a - Interface-Assys Spec.: batteryTestSOH "
      BatteryResult:
        type: "string"
        description: "Ergebnis=Batterie in Ordnung. Batterie nachladen. - CDM TCS\
          \ V1.1: n/a - Interface-Assys Spec.: batteryTestResult "
      StarterVoltage:
        type: "string"
        description: "Starterspannung=11,60 V - CDM TCS V1.1: n/a - Interface-Assys\
          \ Spec.: startTestStartVoltage "
      StarterPowerconsumption:
        type: "string"
        description: "Stromaufnahme=86,7 A - CDM TCS V1.1: n/a - Interface-Assys Spec.:\
          \ startTestPowerConsumption "
      StarterTime:
        type: "string"
        format: "datetime"
        description: "Zeit=2,87 s - CDM TCS V1.1: n/a - Interface-Assys Spec.: startTestTime "
      StarterResult:
        type: "string"
        description: "Ergebnis=Batterie-Startspannung i.O. - CDM TCS V1.1: n/a - Interface-Assys\
          \ Spec.: startTestResult "
      GeneratorNeutralwithoutgas:
        type: "string"
        description: "LeerlaufOhneLast=14,75 V / 12,20 A - CDM TCS V1.1: n/a - Interface-Assys\
          \ Spec.: generatorTestNeutralWithoutGas "
      GeneratorNeutralwithgas:
        type: "string"
        description: "LeerlaufMitLast=14,63 V / 8,80 A - CDM TCS V1.1: n/a - Interface-Assys\
          \ Spec.: generatorTestNeutralWithGas "
      GeneratorRPMwithoutgas:
        type: "string"
        description: "DrehzahlOhneLast=14,69 V / 9,60 A - CDM TCS V1.1: n/a - Interface-Assys\
          \ Spec.: generatorTestRpmWithoutGas "
      GeneratorRPMwithgas:
        type: "string"
        description: "DrehzahlMitLast=14,64 V / 9,00 A - CDM TCS V1.1: n/a - Interface-Assys\
          \ Spec.: generatorTestRpmWithGas "
      GeneratorResult:
        type: "string"
        description: "Ergebnis=Batterie-Startspannung i.O. - CDM TCS V1.1: n/a - Interface-Assys\
          \ Spec.: generatorTestResult "
      StandbyCurrent:
        type: "string"
        description: "Ruhestrom=-3,50 A - CDM TCS V1.1: n/a - Interface-Assys Spec.:\
          \ standbyCurrentTest "
  branddealer:
    type: "object"
    description: "Partner information fields for garages."
    properties:
      Brand:
        type: "string"
        description: "e.g. Audi, Opel - lov name: carmanufacturer "
      Dealercode:
        type: "string"
        description: "External dealer (garage) reference "
        example: "51600"
  case:
    type: "object"
    description: "Base object for all TCS incident cases. The document of an incident\
      \ created by the Service requestor (TCS, assistance organisation, automotive\
      \ club etc.)"
    required:
    - "IncidentDateTime"
    properties:
      Id:
        type: "string"
      CaseReferenceList:
        type: "array"
        items:
          $ref: "#/definitions/reference"
        description: "Needs to be defined for each consumer of the case (Assys, Sparx,\
          \ mLogistics, etc) "
        example: "193001234"
      IncidentDateTime:
        type: "string"
        format: "datetime"
        description: "Format: 2019-07-19 10:52:00.00000 "
      IncidentLocation:
        $ref: "#/definitions/location"
      CaseOwner:
        $ref: "#/definitions/legalperson"
        description: "Organisation identified by case creation channel - CDM TCS V1.1:\
          \ CdmCase.Owner "
      CaseClient:
        $ref: "#/definitions/client"
        description: "e g member of TCS or other club, B2B client - Interface-Assys\
          \ Spec.: ClientId "
      Caller:
        $ref: "#/definitions/person"
        description: "case client or 3rd party (e g Police) "
      MainCause:
        type: "string"
        description: "lov name: casecause - CDM TCS V1.1: CdmCase.IncidentType - Interface-Assys\
          \ Spec.: MainCause "
      ItemsUsedList:
        type: "array"
        items:
          $ref: "#/definitions/item"
        description: "List of vehicles (e g car, bicycle) or devices ( eg charging\
          \ station) - CDM TCS V1.1: CdmCase.Vehicle "
      ServiceDeliveryList:
        type: "array"
        items:
          $ref: "#/definitions/servicedelivery"
      CaseStatus:
        type: "string"
        description: "lov name: casestatus - Interface-Assys Spec.: IncidentStatus "
      NoteList:
        type: "array"
        items:
          $ref: "#/definitions/note"
        description: "Persisted notes/remarks from different users added during case\
          \ live cycle - CDM TCS V1.1: list of Notes "
      Comment:
        type: "string"
        description: "Remarks on case "
      MeasuredPerformanceList:
        type: "array"
        items:
          $ref: "#/definitions/measuredperformance"
      Priority:
        type: "integer"
        description: "Key 4200x are replaced by the same key - 42000 "
      ContextList:
        type: "array"
        items:
          $ref: "#/definitions/context"
        description: "List of context objects meant to provide contextual information\
          \ (process, source, etc.) - CDM TCS V1.1: list of Contexts "
  client:
    type: "object"
    description: "Legal or natural person covered (contract holder or beneficiary)\
      \ identified for the case"
    properties:
      ReferenceList:
        type: "array"
        items:
          $ref: "#/definitions/reference"
      TowingRefused:
        type: "boolean"
      AllowSurvey:
        type: "boolean"
      Person:
        $ref: "#/definitions/person"
        example: "LegalPerson or NaturalPerson"
  component:
    type: "object"
    description: "Faulty component of a vehicle"
    properties:
      Component:
        type: "string"
        description: "ARC Component type - lov name: arcbreakdowncomponent - CDM TCS\
          \ V1.1: CdmVehicleFault.ComponentCode - Interface-Assys Spec.: arcBreakComponentId "
        example: "123"
      Module:
        type: "string"
        description: "ARC Component category type - lov name: arcbreakdowncategory\
          \ - CDM TCS V1.1: derived from component - Interface-Assys Spec.: ComponentCategory "
        example: "1"
  componentfault:
    type: "object"
    description: "A defected component announced by the driver or identified during\
      \ roadside assistance service."
    properties:
      Component:
        $ref: "#/definitions/component"
      Faulttype:
        type: "string"
        description: "lov name: arcbreakdownfault - CDM TCS V1.1: CdmVehicleFault.FaultCode\
          \ - Interface-Assys Spec.: arcBreakFaultId "
      OutcomeType:
        type: "string"
        description: "lov name: arcoutcome - CDM TCS V1.1: CdmVehicleFault.OutcomeCode\
          \ - Interface-Assys Spec.: arcBreakOutcomeId "
      MainreasonB2B:
        type: "string"
        description: "lov name: ereportarccause - CDM TCS V1.1: n/a - Interface-Assys\
          \ Spec.: mainReasonB2B "
      InterventionReason:
        type: "string"
        description: "ASSYS-5258  - lov name: interventionreason - CDM TCS V1.1: n/a\
          \ - Interface-Assys Spec.: InterventionReason "
      DataProvider:
        type: "string"
        description: "ServiceExecutor, ServiceRequestor, ServiceProvider - lov name:\
          \ servicerole "
      Comment:
        type: "string"
        description: "BreakdownDescriptionCustomer - CDM TCS V1.1: n/a - Interface-Assys\
          \ Spec.: VehicleConditionComment "
  context:
    type: "object"
    description: "Key ,value pair which describes the context of the request"
    properties:
      ContextElementTypeKey:
        type: "string"
      ContextElementValue:
        type: "string"
  coordinate:
    type: "object"
    description: "GPS Position of a location for the geographic Information System\
      \ (GIS) using WGS-84 as reference coordinate system"
    properties:
      Latitude:
        type: "number"
        description: "Latitude (WGS84) decimal degrees. Y "
        example: "46.951081"
      Longitude:
        type: "number"
        description: "Longitude (WGS84) decimal degrees. X "
        example: "7.438637"
  coverage:
    type: "object"
    description: "A contract signed or paid between a person (natural or legal) and\
      \ the TCS. The contract has at least one contract version. It is used as a general\
      \ term to refer both assistance contracts and insurance policies."
    properties:
      Coverage:
        type: "boolean"
      Client:
        $ref: "#/definitions/client"
      Product:
        $ref: "#/definitions/product"
      PlateNb:
        type: "string"
      ClientNb:
        type: "string"
      Comment:
        type: "string"
  device:
    allOf:
    - $ref: "#/definitions/item"
    - type: "object"
      description: "Extends item  - Any electric/electronic device to be repaired\
        \ (service extended to home devices also)"
      properties:
        Name:
          type: "string"
          example: "Tesla charging station, Protoscar"
        Type:
          type: "string"
          example: "e.g. charging station, heating system etc…"
        Category:
          type: "string"
          example: "e.g. charging station 22KW "
  document:
    type: "object"
    description: "Object representing a document"
    required:
    - "Name"
    - "Type"
    properties:
      Path:
        type: "string"
      Name:
        type: "string"
      CreatedBy:
        $ref: "#/definitions/naturalperson"
      Active:
        type: "boolean"
      Type:
        type: "string"
        description: "lov name: documenttype "
  equipment:
    type: "object"
    description: "Physical Material needed in the context of field services (FSM)\
      \ to provide an Assistance. "
    properties:
      Name:
        type: "string"
      Type:
        type: "string"
        description: "lov name: equipmenttype "
      Source:
        type: "string"
